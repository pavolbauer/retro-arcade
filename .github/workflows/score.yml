# In deinem Repo speichern als: .github/workflows/score.yml
# Verarbeitet Issues mit Titel "[SCORE] spiel|punkte|level|name" automatisch.
name: Score eintragen
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  score:
    if: startsWith(github.event.issue.title, '[SCORE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score verarbeiten
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const nr = context.payload.issue.number;
            const close = async (msg) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: nr, body: msg });
              await github.rest.issues.update({ ...context.repo, issue_number: nr, state: 'closed' });
            };
            const t = context.payload.issue.title;
            const m = t.match(/^\[SCORE\]\s*(blocks|muncher|snake|breakout)\|(\d{1,7})\|([A-Za-z0-9 ]{0,10})\|(.{1,12})$/);
            if (!m) { await close('âŒ Format ungÃ¼ltig â€“ Eintrag ignoriert.'); return; }
            const [, game, scoreS, lvlRaw, nameRaw] = m;
            const score = parseInt(scoreS, 10);
            const lvl = lvlRaw.trim().toUpperCase();
            const name = (nameRaw.replace(/[^\w Ã„Ã–ÃœÃ¤Ã¶Ã¼ÃŸ-]/g, '').trim().toUpperCase().slice(0, 12)) || 'ANON';
            const file = 'scores.json';
            let data = {};
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch (e) {}
            if (!Array.isArray(data[game])) data[game] = [];
            data[game].push({
              name, score, lvl,
              gh: context.payload.issue.user.login,
              date: new Date().toISOString().slice(0, 10)
            });
            data[game].sort((a, b) => b.score - a.score);
            data[game] = data[game].slice(0, 25);
            fs.writeFileSync(file, JSON.stringify(data, null, 1));
            await close('âœ… Score eingetragen! Er erscheint in ~1 Minute in der globalen Tabelle. Danke fÃ¼rs Spielen! ðŸ•¹ï¸');
      - name: Commit & Push
        run: |
          git config user.name "score-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scores.json
          git diff --cached --quiet || git commit -m "ðŸ† Neuer Highscore-Eintrag"
          git push
